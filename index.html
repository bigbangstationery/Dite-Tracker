var D=['\u0627\u0644\u0623\u062d\u062f','\u0627\u0644\u0627\u062b\u0646\u064a\u0646','\u0627\u0644\u062b\u0644\u0627\u062b\u0627\u0621','\u0627\u0644\u0623\u0631\u0628\u0639\u0627\u0621','\u0627\u0644\u062e\u0645\u064a\u0633','\u0627\u0644\u062c\u0645\u0639\u0629','\u0627\u0644\u0633\u0628\u062a'];
var M=['\u064a\u0646\u0627\u064a\u0631','\u0641\u0628\u0631\u0627\u064a\u0631','\u0645\u0627\u0631\u0633','\u0623\u0628\u0631\u064a\u0644','\u0645\u0627\u064a\u0648','\u064a\u0648\u0646\u064a\u0648','\u064a\u0648\u0644\u064a\u0648','\u0623\u063a\u0633\u0637\u0633','\u0633\u0628\u062a\u0645\u0628\u0631','\u0623\u0643\u062a\u0648\u0628\u0631','\u0646\u0648\u0641\u0645\u0628\u0631','\u062f\u064a\u0633\u0645\u0628\u0631'];
var TX={kal:'\u0643\u0627\u0644\u0648\u0631\u064a',over:'\u062a\u062c\u0627\u0648\u0632\u062a \u0627\u0644\u0647\u062f\u0641 \u0628\u0640 ',under:'\u0636\u0645\u0646 \u0627\u0644\u0647\u062f\u0641 \u2014 \u0645\u062a\u0628\u0642\u064a ',lk:'\u0645\u062d\u0641\u0648\u0638',sv:'\u062d\u0641\u0638',cn:'\u0625\u0644\u063a\u0627\u0621',wG:'\u0636\u0645\u0646 \u0627\u0644\u0633\u0639\u0631\u0627\u062a \u0627\u0644\u0623\u0633\u0628\u0648\u0639\u064a\u0629',f2:'\u064a\u0648\u0645\u0627\u0646 \u0635\u064a\u0627\u0645 \u0639\u0644\u0649 \u0627\u0644\u0623\u0642\u0644',e4:'4 \u0623\u064a\u0627\u0645 \u0631\u064a\u0627\u0636\u0629 \u0639\u0644\u0649 \u0627\u0644\u0623\u0642\u0644',w3:'\u0645\u0634\u064a +10000 \u062e\u0637\u0648\u0629 3 \u0623\u064a\u0627\u0645',rem:'\u0645\u062a\u0628\u0642\u064a\u0629',ex:'\u062a\u062c\u0627\u0648\u0632',sport:'\u0631\u064a\u0627\u0636\u0629 \u2713',done:'\u0645\u062d\u0641\u0648\u0638',tot:'\u0645\u062c\u0645\u0648\u0639 \u0627\u0644\u0633\u0639\u0631\u0627\u062a',fd:'\u0623\u064a\u0627\u0645 \u0627\u0644\u0635\u064a\u0627\u0645',ed:'\u0623\u064a\u0627\u0645 \u0627\u0644\u0631\u064a\u0627\u0636\u0629',rep:'\u062a\u0642\u0631\u064a\u0631 ',cfm:'\u0647\u0644 \u0623\u0646\u062a \u0645\u062a\u0623\u0643\u062f\u061f \u0633\u064a\u062a\u0645 \u062d\u0630\u0641 \u062c\u0645\u064a\u0639 \u0628\u064a\u0627\u0646\u0627\u062a \u0647\u0630\u0627 \u0627\u0644\u0623\u0633\u0628\u0648\u0639.',yes:'\u0646\u0639\u0645\u060c \u0641\u0631\u063a\u0647',no:'\u0625\u0644\u063a\u0627\u0621',syncing:'\u062c\u0627\u0631\u064a \u0627\u0644\u062d\u0641\u0638...',synced:'\u0645\u062d\u0641\u0648\u0638 \u0639\u0644\u0649 \u0627\u0644\u0633\u062d\u0627\u0628 \u2713',syncErr:'\u062e\u0637\u0623 \u0641\u064a \u0627\u0644\u0645\u0632\u0627\u0645\u0646\u0629',loading:'\u062c\u0627\u0631\u064a \u062a\u062d\u0645\u064a\u0644 \u0627\u0644\u0628\u064a\u0627\u0646\u0627\u062a...'};
var WM={low:'\u0623\u0642\u0644 5k',mid:'7-10k',high:'+10k'};
var FM={'16':'16 \u0633\u0627\u0639\u0629','18':'18 \u0633\u0627\u0639\u0629'};
var G=2000,of=0,di=0,em=-1,wd={};

function setSyncStatus(type,msg){
  var el=document.getElementById('sync-txt');
  var bar=document.getElementById('sync-status');
  el.textContent=msg;
  bar.className='sync-status sync-'+type;
}

async function loadFromFirebase(){
  setSyncStatus('ing',TX.loading);
  try{
    var snap=await getDoc(doc(db,'trackers',DEVICE_ID));
    if(snap.exists()){
      var data=snap.data();
      var wkData=data[wkey(of)];
      wd=wkData||{};
    } else {wd={};}
    setSyncStatus('ok',TX.synced);
  }catch(e){
    wd=JSON.parse(localStorage.getItem(wkey(of))||'{}');
    setSyncStatus('err',TX.syncErr);
  }
  render();
}

async function saveToFirebase(){
  setSyncStatus('ing',TX.syncing);
  try{
    var allData={};
    allData[wkey(of)]=wd;
    await setDoc(doc(db,'trackers',DEVICE_ID),allData,{merge:true});
    localStorage.setItem(wkey(of),JSON.stringify(wd));
    setSyncStatus('ok',TX.synced);
  }catch(e){
    localStorage.setItem(wkey(of),JSON.stringify(wd));
    setSyncStatus('err',TX.syncErr);
  }
}

window.syncNow=async function(){await loadFromFirebase();};

function mon(o){var n=new Date(),d=n.getDay(),m=new Date(n);m.setDate(n.getDate()-((d+6)%7)+o*7);m.setHours(0,0,0,0);return m;}
function wdts(o){var m=mon(o);return Array.from({length:7},function(_,i){var d=new Date(m);d.setDate(m.getDate()+i);return d;});}
function fmt(d){return d.getDate()+' '+M[d.getMonth()];}
function fmtF(d){return d.getDate()+' '+M[d.getMonth()]+' '+d.getFullYear();}
function wkey(o){var m=mon(o);return 'wk_'+m.getFullYear()+'_'+(m.getMonth()+1)+'_'+m.getDate();}
function gd(i){return wd['d'+i]||{meals:[],walk:null,ex:null,fast:'none',saved:false};}
function sd2(i,d){wd['d'+i]=d;}
function tc(meals){return(meals||[]).reduce(function(s,m){return s+(parseInt(m.cal)||0);},0);}
function esc(t){var d=document.createElement('div');d.appendChild(document.createTextNode(t));return d.innerHTML;}

window.cw=function(x){of+=x;loadFromFirebase();di=0;em=-1;};
window.ss=function(sec,btn){
  document.getElementById('sd').style.display=sec==='day'?'':'none';
  document.getElementById('swk2').style.display=sec==='week'?'':'none';
  document.querySelectorAll('.tsb').forEach(function(b){b.classList.remove('on');});
  btn.classList.add('on');
  document.getElementById('ca').innerHTML='';
  if(sec==='week')rw();
};

function render(){
  var dates=wdts(of);
  document.getElementById('wt').textContent=fmt(dates[0])+' - '+fmt(dates[6]);
  var strip=document.getElementById('ds');strip.innerHTML='';
  dates.forEach(function(d,i){
    var dd=gd(i),cal=tc(dd.meals);
    var b=document.createElement('button');
    b.className='dc'+(i===di?' on':'')+(dd.saved?' saved':'')+(cal>G?' over':cal>0?' good':'');
    b.innerHTML='<span class="dcn">'+D[d.getDay()]+'</span><span class="dcdot"></span>';
    b.onclick=(function(idx){return function(){di=idx;em=-1;render();};})(i);
    strip.appendChild(b);
  });
  rdDay(dates[di]);
}

function rdDay(date){
  var dd=gd(di),lk=dd.saved,cal=tc(dd.meals);
  document.getElementById('dn').textContent=D[date.getDay()];
  document.getElementById('lks').innerHTML=lk?'<span class="lk-badge"><i class="ti ti-lock" style="font-size:13px"></i> '+TX.lk+'</span>':'';
  document.getElementById('cn').textContent=cal.toLocaleString();
  var ab=document.getElementById('ab');
  if(cal>0){ab.innerHTML=cal>G?'<div class="abar aover"><i class="ti ti-alert-triangle"></i><span>'+TX.over+(cal-G).toLocaleString()+' '+TX.kal+'</span></div>':'<div class="abar aok"><i class="ti ti-circle-check"></i><span>'+TX.under+(G-cal).toLocaleString()+' '+TX.kal+'</span></div>';}
  else ab.innerHTML='';
  var ml=document.getElementById('ml');ml.innerHTML='';
  (dd.meals||[]).forEach(function(m,i){
    if(em===i){
      var r=document.createElement('div');r.className='edit-row';
      r.innerHTML='<input type="text" id="en" value="'+esc(m.name)+'" style="flex:1;min-width:90px"><input type="number" id="ec" value="'+m.cal+'" style="width:80px" min="0"><button class="esv" onclick="sme('+i+')">'+TX.sv+'</button><button class="ecn" onclick="cme()">'+TX.cn+'</button>';
      ml.appendChild(r);
    } else {
      var div=document.createElement('div');div.className='meal-row';
      div.innerHTML='<span class="mn">'+esc(m.name)+'</span><span class="mk">'+parseInt(m.cal).toLocaleString()+' '+TX.kal+'</span>'+(lk?'':'<span class="mbtns"><button class="ib" onclick="stme('+i+')"><i class="ti ti-edit"></i></button><button class="ib d" onclick="dm('+i+')"><i class="ti ti-trash"></i></button></span>');
      ml.appendChild(div);
    }
  });
  document.getElementById('ar').style.display=lk?'none':'flex';
  document.querySelectorAll('[data-v]').forEach(function(b){b.className='sg'+(gd(di).walk===b.dataset.v?' g':'');b.disabled=lk;});
  document.querySelectorAll('[data-ex]').forEach(function(b){var v=b.dataset.ex,cur=gd(di).ex;b.className='sg'+(cur===v?(v==='yes'?' g':' r'):'');b.disabled=lk;});
  document.querySelectorAll('[data-f]').forEach(function(b){b.className='sg'+(gd(di).fast===b.dataset.f?' b':'');b.disabled=lk;});
  document.getElementById('sb').style.display=lk?'none':'';
  document.getElementById('eb').style.display=lk?'':'none';
}

window.stme=function(i){em=i;render();setTimeout(function(){var e=document.getElementById('en');if(e)e.focus();},50);};
window.cme=function(){em=-1;render();};
window.sme=function(i){var n=document.getElementById('en').value.trim(),c=document.getElementById('ec').value;if(!n)return;var dd=gd(di);dd.meals[i]={name:n,cal:parseInt(c)||0};sd2(di,dd);em=-1;render();};
window.am=function(){var n=document.getElementById('inp').value.trim(),c=document.getElementById('icc').value;if(!n||!c)return;var dd=gd(di);dd.meals.push({name:n,cal:parseInt(c)||0});sd2(di,dd);document.getElementById('inp').value='';document.getElementById('icc').value='';render();};
window.dm=function(i){var dd=gd(di);dd.meals.splice(i,1);sd2(di,dd);if(em===i)em=-1;render();};
window.swk=function(v){var dd=gd(di);dd.walk=dd.walk===v?null:v;sd2(di,dd);render();};
window.sex=function(v){var dd=gd(di);dd.ex=dd.ex===v?null:v;sd2(di,dd);render();};
window.sft=function(v){var dd=gd(di);dd.fast=dd.fast===v?'none':v;sd2(di,dd);render();};
window.savD=function(){var dd=gd(di);dd.saved=true;sd2(di,dd);saveToFirebase();render();};
window.edD=function(){var dd=gd(di);dd.saved=false;sd2(di,dd);saveToFirebase();render();};
window.ac=function(){document.getElementById('ca').innerHTML='<div class="cfbox"><p>'+TX.cfm+'</p><div class="cfrow"><button class="byes" onclick="clrW()"><i class="ti ti-trash"></i> '+TX.yes+'</button><button class="bno" onclick="document.getElementById(\'ca\').innerHTML=\'\'">'+TX.no+'</button></div></div>';};
window.clrW=function(){wd={};saveToFirebase();document.getElementById('ca').innerHTML='';di=0;em=-1;ss('day',document.querySelector('.tsb'));render();};

function rw(){
  var dates=wdts(of),tot=0,fd=0,ed=0,hw=0;
  dates.forEach(function(_,i){var dd=gd(i);tot+=tc(dd.meals);if(dd.fast==='16'||dd.fast==='18')fd++;if(dd.ex==='yes')ed++;if(dd.walk==='high')hw++;});
  var wg=G*7,df=wg-tot;
  document.getElementById('rt').textContent=TX.rep+fmtF(dates[0])+' - '+fmtF(dates[6]);
  document.getElementById('ws').innerHTML='<div class="sc"><div class="sn">'+tot.toLocaleString()+'</div><div class="sl">'+TX.tot+'</div></div><div class="sc"><div class="sn" style="color:'+(df>=0?'var(--green)':'var(--red)')+'">'+Math.abs(df).toLocaleString()+'</div><div class="sl">'+(df>=0?TX.rem:TX.ex)+'</div></div><div class="sc"><div class="sn">'+fd+'</div><div class="sl">'+TX.fd+'</div></div><div class="sc"><div class="sn">'+ed+'</div><div class="sl">'+TX.ed+'</div></div>';
  var cks=[{l:TX.wG,ok:tot<=wg,v:tot.toLocaleString()+' / '+wg.toLocaleString()},{l:TX.f2,ok:fd>=2,v:fd+' / 2'},{l:TX.e4,ok:ed>=4,v:ed+' / 4'},{l:TX.w3,ok:hw>=3,v:hw+' / 3'}];
  document.getElementById('wc').innerHTML=cks.map(function(c){return '<div class="ci"><div class="cico '+(c.ok?'ck-ok':'ck-fl')+'"><i class="ti '+(c.ok?'ti-check':'ti-x')+'"></i></div><span class="ctxt">'+c.l+'</span><span class="cbdg '+(c.ok?'cbok':'cbfl')+'">'+c.v+'</span></div>';}).join('');
  document.getElementById('wdd').innerHTML=dates.map(function(d,i){var dd=gd(i),cal=tc(dd.meals);return '<div class="dr"><span class="drd">'+D[d.getDay()]+'</span><span class="drc" style="color:'+(cal>G?'var(--red)':'var(--muted)')+'">'+cal.toLocaleString()+' '+TX.kal+'</span><span class="pl '+(dd.ex==='yes'?'plg':'pln')+'">'+(dd.ex==='yes'?TX.sport:'-')+'</span><span class="pl '+(dd.walk?'plg':'pln')+'">'+(WM[dd.walk]||'-')+'</span><span class="pl '+(dd.fast&&dd.fast!=='none'?'plb':'pln')+'">'+(FM[dd.fast]||'-')+'</span><span class="pl '+(dd.saved?'plg':'pln')+'">'+(dd.saved?TX.done:'-')+'</span></div>';}).join('');
}

document.getElementById('icc').addEventListener('keydown',function(e){if(e.key==='Enter')window.am();});
document.getElementById('inp').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('icc').focus();});

loadFromFirebase();
</script>
</body>
</html>
